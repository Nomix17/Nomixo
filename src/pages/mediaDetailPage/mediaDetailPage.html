<html>
  <head>
    <meta charset="UTF-8">
    <title>Nomixo</title>
    <link rel="icon" href="../../../assets/icons/logo.png" type="image/x-icon">
    <script src="../../shared/sharedFuncs.js" defer></script>
    <script src="mediaDetailPage.js" defer></script>

    <link rel="preload" href="theme://theme.css" as="style">
    <link rel="preload" href="../../shared/loadingDiv.css" as="style">
    <link rel="preload" href="../../shared/dropDown.css" as="style">
    <link rel="preload" href="../../shared/warningMessage.css" as="style">
    <link rel="preload" href="../../shared/toggleSwitch.css" as="style">
    <link rel="preload" href="../homePage/homePage.css" as="style">
    <link rel="preload" href="mediaDetailPage.css" as="style">

    <link id="test" rel="stylesheet" href="theme://theme.css">
    <link rel="stylesheet" href="../../shared/loadingDiv.css">
    <link rel="stylesheet" href="../../shared/dropDown.css">
    <link rel="stylesheet" href="../../shared/warningMessage.css">
    <link rel="stylesheet" href="../../shared/toggleSwitch.css">
    <link rel="stylesheet" href="../homePage/homePage.css">
    <link rel="stylesheet" href="mediaDetailPage.css">
  </head>
  
  <body>
    <div id="div-globlaLoadingGif" class="img-movieMedias-LoadingGif" class="loader">
      <div class="dot dot1"></div>
      <div class="dot dot2"></div>
      <div class="dot dot3"></div>
      <div class="dot dot4"></div>
    </div>
    <div id="div-main">
      <!-- top div -->
      <div id="div-top">
        <button id="btn-goBack" onclick="goBack()">
          <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <button id="btn-fullscreen" onclick="fullscreenClicked()"></button>
      </div>
      
      <!-- middle div --> 
      <div id="div-middle">
        <div id="div-detailsColumn">
          <div id="div-movieDetails">
            <h1 id="h1-MovieTitle"></h1>
            <div id="div-MovieLogoTitleContainer">
              <img id="img-MovieLogoTitle"/>
            </div>
            <div id="div-collectionInfos" style="display:none"></div>
            <div id="div-genelareInfos">
              <p id="p-movieDuration"></p>
              <p id="p-movieYearOfRelease"></p>
              <div id="movie-rating-div">
                <p id="p-movieRating"></p><img id="img-IMDBlogo" src="../../../assets/icons/IMDB.svg"></img>
              </div>
            </div>
            <div id="div-genresInfos">
              <h2>Genres</h2>
            </div>
            <div id="div-directorInfos">
              <h2>Director</h2>
            </div>
            <div id="div-castInfos">
              <h2>Cast</h2> 
            </div>
            <div id="div-movieSummary">
              <h2>Summary</h2>
              <p class="infoText" id="p-summaryParagraph"></p>
            </div>
          </div>
          <div id="bottomButtonsDiv">
            <div class="split-save-btn">

              <button class="split-save-btn__main" onclick="addMediaToLibrary()">
                <svg class="toggleButtonIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                  <use href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/svgs/regular/bookmark.svg"></use>
                </svg>
                Save To Library
              </button>

              <span class="split-save-btn__divider"></span>

              <div class="custom-select upward noResize" id="custon-save-dropdown">
                <button class="select-trigger" aria-haspopup="listbox" aria-expanded="false"> </button>
                <div class="select-dropdown" role="listbox" id="select-save">
                  <div class="select-option" role="option" value="Watch Later">Watch Later</div>
                  <div class="select-option" role="option" value="Currently Watching">Currently Watching</div>
                  <div class="select-option" role="option" value="Watched">Watched</div>
                </div>
              </div>

            </div>

            <div id="movie-trailer-div">
              <div class="button-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-clapperboard-icon lucide-clapperboard">
                  <path d="m12.296 3.464 3.02 3.956"/>
                  <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3z"/>
                  <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                  <path d="m6.18 5.276 3.1 3.899"/>
                </svg>
                <p id="p-movie-trailer">Watch Trailer</p>
              </div>
            </div>

            <div id="bulk-download-div" style="display:none">
              <button id="btn-bulkDownload" class="button-wrapper" type="button" aria-label="Download episodes" onclick="openBulkDownload()">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <path d="M7 10l5 5 5-5"/>
                  <path d="M12 15V3"/>
                </svg>
                <p id="p-bulk-download">Download Episodes</p>
              </button>
            </div>
          </div>
        </div>

        <div style="display:none" id="div-episodesSidePanel">
          <div class="selectSeason-container">
            <button class="toggleButton">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512">
                <path d="M311.1 233.4c12.5 12.5 12.5 32.8 0 45.3l-192 192c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3L243.2 256 73.9 86.6c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0l192 192z"/>
              </svg>
            </button>

            <div class="custom-select">
              <button class="select-trigger" aria-haspopup="listbox" aria-expanded="false">Season —</button>
              <div class="select-dropdown" role="listbox" id="select-Seasons"></div>
            </div>
          </div>

          <div id="EpisodesContainer">
            <div class="img-movieMedias-LoadingGif" class="loader">
                <div class="dot dot1"></div>
                <div class="dot dot2"></div>
                <div class="dot dot3"></div>
                <div class="dot dot4"></div>
            </div>
          </div>
        </div>
          
        <div style="display:none" id="div-torrentSidePanel">
          <div id = "dummyDiv"></div>
          <div class="torrent-loader img-movieMedias-LoadingGif">
            <div class="dot dot1"></div>
            <div class="dot dot2"></div>
            <div class="dot dot3"></div>
            <div class="dot dot4"></div>
          </div>
          <div id="div-movieMedias"></div>
        </div> 
      </div>
    </div>

    <ul id="contextMenu" class="context-menu">
      <li id="DownloadOption">Download</li>
    </ul>

    <div class="overlay" id="downloadOverlay">
      <div class="download-container single-container" id="singleContainer" role="dialog" aria-modal="true" aria-labelledby="mediaTitle">
        <button class="floating-x-remove-btn" id="closeBtn" aria-label="Close">×</button>

        <!-- Hero: blurred backdrop, poster, title and file info -->
        <header class="single-hero">
          <div class="single-hero-image" id="singleHeroImage"></div>
          <div class="single-hero-shade"></div>

          <div class="media-info">
            <div class="media-poster" id="mediaPoster">
              <img alt="Movie Poster" id="mediaPosterImg">
            </div>
            <div class="media-details">
              <h2 id="mediaTitle"></h2>
              <p id="season-episode"></p>
              <p class="media-year" id="mediaYear"></p>
              <p class="media-size" id="mediaSize"></p>
            </div>
          </div>
        </header>

        <div class="single-body">
          <div class="message" id="message"></div>

          <section class="single-section">
            <span class="single-section-title">Save to</span>
            <div class="single-path">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              </svg>
              <input type="text" id="downloadPath" value="/home/pcuser/Downloads/Videos/" aria-label="Download location" spellcheck="false">
              <button id="browseBtn" type="button">Browse</button>
              <input id="browseInput" type="file" style="display:none">
            </div>
          </section>

          <div class="single-options">
            <label class="bulk-switch">
              <span class="custom-toggle">
                <input type="checkbox" id="addSubtitles" checked>
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
              </span>
              <span class="bulk-switch-label">Download subtitles</span>
            </label>
            <label class="bulk-switch">
              <span class="custom-toggle">
                <input type="checkbox" id="rememberPath">
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
              </span>
              <span class="bulk-switch-label">Remember this location</span>
            </label>
          </div>
        </div>

        <footer class="single-footer">
          <button id="cancelBtn" class="bulk-btn bulk-btn-ghost" type="button">Cancel</button>
          <button id="downloadBtn" class="bulk-btn bulk-btn-primary" type="button">Download</button>
        </footer>
      </div>
    </div>



    <div class="overlay" id="bulkDownloadOverlay">
      <div class="download-container bulk-container" id="bulkContainer" role="dialog" aria-modal="true" aria-labelledby="bulkTitle">
        <button class="floating-x-remove-btn" id="bulkCloseBtn" aria-label="Close">×</button>

        <!-- Cinematic hero: backdrop, title logo, quality -->
        <header class="bulk-hero" id="bulkHero">
          <div class="bulk-hero-image" id="bulkHeroImage"></div>
          <div class="bulk-hero-shade"></div>

          <div class="bulk-hero-copy">
            <h2 id="bulkTitle">Download episodes</h2>
            <img class="bulk-hero-logo" id="bulkHeroLogo" alt="" hidden>
            <p class="bulk-subtitle" id="bulkSubtitle"></p>
          </div>

          <div class="bulk-quality" id="bulkQualityWrap">
            <span class="bulk-quality-title">Quality</span>
            <div class="bulk-segmented" id="bulkQuality" role="radiogroup" aria-label="Video quality">
              <label><input type="radio" name="bulkQuality" value="best"><span>Best</span></label>
              <label><input type="radio" name="bulkQuality" value="4K"><span>4K</span></label>
              <label><input type="radio" name="bulkQuality" value="1080p" checked><span>1080p</span></label>
              <label><input type="radio" name="bulkQuality" value="720p"><span>720p</span></label>
              <label><input type="radio" name="bulkQuality" value="480p"><span>480p</span></label>
            </div>
          </div>
        </header>

        <div class="bulk-scroll bulk-lockable">

          <!-- Season + episode picker -->
          <section class="bulk-picker">
            <aside class="bulk-rail" aria-label="Seasons">
              <div class="bulk-rail-head">
                <span class="bulk-section-title">Seasons</span>
                <div class="bulk-list-actions">
                  <button type="button" class="bulk-link-btn" id="bulkSelectAll">All</button>
                  <button type="button" class="bulk-link-btn" id="bulkClearAll">None</button>
                </div>
              </div>
              <div class="bulk-season-list" id="bulkSeasonList"></div>
            </aside>

            <div class="bulk-panel">
              <div class="bulk-panel-head">
                <div class="bulk-panel-heading">
                  <h3 id="bulkPanelTitle"></h3>
                  <p id="bulkPanelMeta"></p>
                </div>
                <button type="button" class="bulk-link-btn bulk-pill-btn" id="bulkSeasonToggle">Select season</button>
              </div>
              <div class="bulk-episode-list" id="bulkEpisodeList"></div>
            </div>
          </section>

          <!-- Destination + options -->
          <section class="bulk-section bulk-destination">
            <span class="bulk-section-title">Save to</span>
            <div class="bulk-path">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              </svg>
              <input type="text" id="bulkDownloadPath" value="/home/pcuser/Downloads/Videos/" aria-label="Download location" spellcheck="false">
              <button id="bulkBrowseBtn" type="button">Browse</button>
            </div>
            <div class="bulk-options">
              <label class="bulk-switch">
                <span class="custom-toggle">
                  <input type="checkbox" id="bulkAddSubtitles" checked>
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                </span>
                <span class="bulk-switch-label">Download subtitles</span>
              </label>
              <label class="bulk-switch">
                <span class="custom-toggle">
                  <input type="checkbox" id="bulkRememberPath">
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                </span>
                <span class="bulk-switch-label">Remember this location</span>
              </label>
            </div>
          </section>
        </div>

        <footer class="bulk-footer">
          <div class="bulk-progress" id="bulkProgress" aria-hidden="true"><span id="bulkProgressBar"></span></div>
          <div class="message" id="bulkMessage" role="alert"></div>
          <div class="bulk-footer-row">
            <p class="bulk-summary" id="bulkSummary" aria-live="polite"></p>
            <div class="bulk-footer-actions">
              <button id="bulkCancelBtn" class="bulk-btn bulk-btn-ghost" type="button">Cancel</button>
              <button id="bulkDownloadBtn" class="bulk-btn bulk-btn-primary" type="button">Download</button>
            </div>
          </div>
        </footer>
      </div>
    </div>

  </body>

</html>
